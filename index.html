<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Numeri Duello">
<meta name="theme-color" content="#4f46e5">
<title>Numeri Duello</title>
<style>
  :root{
    --bg:#f4f4f8; --card:#ffffff; --text:#1c1c28; --muted:#6b6b80;
    --accent:#4f46e5; --accent-text:#fff; --good:#16a34a; --bad:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14141c; --card:#22222e; --text:#f2f2f7; --muted:#9a9ab0; --accent:#6366f1; --good:#4ade80; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
    min-height:100vh;display:flex;flex-direction:column;gap:14px}
  h1{font-size:30px;margin:8px 0 0;text-align:center}
  h2{font-size:22px;margin:0;text-align:center}
  h3{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600}
  p{margin:0;text-align:center;color:var(--muted);line-height:1.4}
  button{font:inherit;border:0;border-radius:14px;padding:16px;font-weight:600;font-size:18px;
    background:var(--card);color:var(--text);width:100%;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-text)}
  button:disabled{opacity:.4}
  button.link{background:none;color:var(--muted);font-size:16px}
  input{font:inherit;font-size:28px;letter-spacing:6px;text-align:center;text-transform:uppercase;
    width:100%;padding:14px;border-radius:14px;border:2px solid var(--card);background:var(--card);color:var(--text);
    -webkit-user-select:text;user-select:text}
  .chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .chips button{padding:12px 0;font-size:20px}
  .chips button.on{background:var(--accent);color:var(--accent-text)}
  .slots{display:flex;gap:6px;justify-content:center}
  .slot{flex:1;max-width:52px;height:58px;border-radius:12px;background:var(--card);
    display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;border:2px solid transparent}
  .slot.active{border-color:var(--accent)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{height:56px;padding:0;font-size:26px;font-weight:700}
  .pad button.alt{color:var(--muted);font-size:22px}
  .code{font-size:48px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--accent)}
  .err{color:var(--bad);text-align:center;font-weight:600}
  .banner{background:var(--card);border-radius:14px;padding:12px;text-align:center;font-size:20px;font-weight:700}
  .spinner{width:28px;height:28px;border:4px solid var(--card);border-top-color:var(--accent);
    border-radius:50%;animation:s 1s linear infinite;margin:0 auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .big{font-size:56px;text-align:center}
  .hist{background:var(--card);border-radius:14px;padding:8px 12px;max-height:36vh;overflow-y:auto}
  .hist.full{max-height:none}
  .hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg)}
  .hrow:last-child{border-bottom:0}
  .hrow .idx{color:var(--muted);font-size:15px;min-width:30px}
  .hrow .num{flex:1;font-size:28px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hrow .hits{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:58px;color:var(--muted)}
  .hrow .hits b{font-size:26px;font-weight:800}
  .hrow .hits small{font-size:13px;font-weight:600}
  .hrow .hits.pos{color:var(--good)}
  .empty{padding:14px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const PREFIX = 'numduello-v2-';
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const $app = document.getElementById('app');
let peer = null, conn = null;
const S = {};

function reset(){
  Object.assign(S, {
    phase:'lobby', mode:'none', code:'', join:'', err:'', online:false, busy:false,
    len:4, cur:[], secret:[], iReady:false, oppReady:false, myTurn:false, isHost:false,
    mine:[], iWon:false, oppSecret:[]
  });
}
reset();

function genCode(){
  let c=''; for(let i=0;i<4;i++) c+=ALPHABET[Math.floor(Math.random()*ALPHABET.length)];
  return c;
}

function cleanup(){
  const c = conn, p = peer;
  conn = null; peer = null;
  try{ c && c.close(); }catch(e){}
  try{ p && p.destroy(); }catch(e){}
}

function send(m){ if(conn && conn.open) conn.send(m); }

/* ---------- Connessione ---------- */
function setLen(n){ S.len=n; render(); }

function hostGame(){
  const len = S.len;
  cleanup(); reset();
  S.len = len; S.mode='host'; S.isHost=true; S.code=genCode(); render();
  const p = new Peer(PREFIX + S.code);
  peer = p;
  p.on('open', ()=>{ if(peer!==p) return; S.online=true; render(); });
  p.on('connection', c=>{
    if(conn){ c.close(); return; }
    setupConn(c);
  });
  p.on('error', e=>{
    if(peer!==p) return;
    if(e.type==='unavailable-id'){ S.len=len; hostGame(); return; }
    S.err='Errore di rete ('+e.type+'). Riprova.'; render();
  });
}

function joinGame(){
  const code = S.join.replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){ S.err='Il codice ha 4 caratteri.'; render(); return; }
  cleanup(); reset();
  S.mode='join'; S.join=code; S.busy=true; render();
  const p = new Peer();
  peer = p;
  p.on('open', ()=>{
    if(peer!==p) return;
    setupConn(p.connect(PREFIX + code, {reliable:true}));
  });
  p.on('error', e=>{
    if(peer!==p) return;
    S.busy=false;
    S.err = e.type==='peer-unavailable' ? 'Partita non trovata. Controlla il codice.' : 'Errore di rete ('+e.type+').';
    render();
  });
}

function setupConn(c){
  conn = c;
  const start = ()=>{
    if(conn!==c) return;
    if(S.isHost){
      send({t:'config', len:S.len});
      S.phase='pick'; S.cur=[]; S.err=''; render();
    }
  };
  if(c.open) start(); else c.on('open', start);
  c.on('data', m=>{ if(conn===c) handle(m); });
  c.on('close', ()=>{
    if(conn!==c) return;
    const playing = S.phase==='pick' || S.phase==='play' || S.busy;
    cleanup(); reset();
    if(playing) S.err = "L'avversario si è disconnesso.";
    render();
  });
}

function leave(){ cleanup(); reset(); render(); }

/* ---------- Logica di gioco ---------- */
function checkStart(){
  if(S.phase==='pick' && S.iReady && S.oppReady){
    S.phase='play'; S.myTurn=S.isHost; S.cur=[];
  }
}

// conta solo le cifre giuste NELLA POSIZIONE giusta
function countHits(guess, secret){
  let h=0;
  for(let i=0;i<secret.length;i++) if(guess[i]===secret[i]) h++;
  return h;
}

function handle(m){
  if(m.t==='config'){
    S.len=m.len; S.busy=false; S.phase='pick'; S.cur=[]; S.err='';
  } else if(m.t==='ready'){
    S.oppReady=true; checkStart();
  } else if(m.t==='guess'){
    if(!Array.isArray(m.g) || m.g.length!==S.len) return;
    const hits = countHits(m.g, S.secret);
    send({t:'result', g:m.g, hits});
    if(hits===S.len){
      S.iWon=false; send({t:'secret', s:S.secret}); S.phase='end';
    } else {
      S.myTurn=true;
    }
  } else if(m.t==='result'){
    S.mine.push({n:m.g, hits:m.hits});
    if(m.hits===S.len){
      S.iWon=true; send({t:'secret', s:S.secret}); S.phase='end';
    }
  } else if(m.t==='secret'){
    S.oppSecret=m.s;
  }
  render();
}

function locked(){
  return (S.phase==='pick' && S.iReady) || (S.phase==='play' && !S.myTurn);
}
function press(d){ if(locked()||S.cur.length>=S.len) return; S.cur.push(d); render(); }
function back(){ if(locked()) return; S.cur.pop(); render(); }
function clearAll(){ if(locked()) return; S.cur=[]; render(); }

function confirmSecret(){
  if(S.cur.length!==S.len) return;
  S.secret=[...S.cur];
  S.iReady=true; S.cur=[];
  send({t:'ready'});
  checkStart(); render();
}

function makeGuess(){
  if(!S.myTurn || S.cur.length!==S.len) return;
  send({t:'guess', g:[...S.cur]});
  S.myTurn=false; S.cur=[]; render();
}

/* ---------- UI ---------- */
function slots(){
  let h='<div class="slots">';
  const lk = locked();
  for(let i=0;i<S.len;i++){
    const v = S.cur[i];
    const active = !lk && i===S.cur.length;
    h+=`<div class="slot ${active?'active':''}">${v===undefined?'':v}</div>`;
  }
  return h+'</div>';
}

function keypad(){
  const dis = locked() ? 'disabled' : '';
  let h='<div class="pad">';
  for(let d=1;d<=9;d++) h+=`<button ${dis} onclick="press(${d})">${d}</button>`;
  h+=`<button class="alt" ${dis} onclick="clearAll()">C</button>`;
  h+=`<button ${dis} onclick="press(0)">0</button>`;
  h+=`<button class="alt" ${dis} onclick="back()">⌫</button>`;
  return h+'</div>';
}

function history(full){
  let h=`<div><h3>I tuoi tentativi</h3><div class="hist ${full?'full':''}" id="hist">`;
  if(!S.mine.length) h+='<div class="empty">Nessun tentativo ancora</div>';
  S.mine.forEach((a,i)=>{
    h+=`<div class="hrow"><span class="idx">#${i+1}</span><span class="num">${a.n.join(' ')}</span>`+
       `<span class="hits ${a.hits>0?'pos':''}"><b>${a.hits}</b><small>${a.hits===1?'giusta':'giuste'}</small></span></div>`;
  });
  return h+'</div></div>';
}

function render(){
  let h='';
  const err = S.err ? `<div class="err">${S.err}</div>` : '';

  if(S.phase==='lobby'){
    h += '<h1>🔢 Numeri Duello</h1>';
    h += '<p>Indovina il numero segreto dell\'avversario.<br>Ti dirà quante cifre sono giuste <b>nella posizione giusta</b>.</p>';
    h += err;
    if(S.mode==='none'){
      h += '<h3 style="text-align:center">Quante cifre ha il numero? (lo decide chi crea la partita)</h3>';
      h += '<div class="chips">';
      for(let n=4;n<=9;n++) h+=`<button class="${S.len===n?'on':''}" onclick="setLen(${n})">${n}</button>`;
      h += '</div>';
      h += '<button class="primary" onclick="hostGame()">Crea partita</button>';
      h += '<p>oppure inserisci il codice dell\'amico</p>';
      h += `<input id="code" maxlength="4" placeholder="CODICE" value="${S.join}" autocapitalize="characters" autocomplete="off" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');S.join=this.value">`;
      h += '<button onclick="joinGame()">Unisciti</button>';
    } else if(S.mode==='host'){
      if(S.online){
        h += `<p>Numero di <b>${S.len} cifre</b>. Dai questo codice al tuo avversario:</p>`;
        h += `<div class="code">${S.code}</div>`;
        h += '<div class="spinner"></div><p>In attesa dell\'avversario…</p>';
      } else if(!S.err){
        h += '<div class="spinner"></div><p>Connessione al server…</p>';
      }
      h += '<button class="link" onclick="leave()">Annulla</button>';
    } else if(S.mode==='join'){
      if(S.busy) h += '<div class="spinner"></div><p>Mi collego alla partita…</p>';
      h += '<button class="link" onclick="leave()">Indietro</button>';
    }
  }

  else if(S.phase==='pick'){
    h += `<h2>Scegli il tuo numero segreto</h2>`;
    h += `<p>${S.len} cifre (da 0 a 9, anche ripetute)</p>`;
    if(S.iReady){
      h += `<div class="banner">${S.secret.join(' ')}</div>`;
      h += '<div class="spinner"></div><p>In attesa dell\'avversario…</p>';
    } else {
      h += slots() + keypad();
      h += `<button class="primary" ${S.cur.length!==S.len?'disabled':''} onclick="confirmSecret()">Pronto!</button>`;
    }
  }

  else if(S.phase==='play'){
    h += `<div class="banner">${S.myTurn?'🎯 Tocca a te!':'⏳ Turno dell\'avversario'}</div>`;
    h += `<p>Il tuo numero: <b>${S.secret.join(' ')}</b> · da indovinare: ${S.len} cifre</p>`;
    h += history(false);
    h += slots() + keypad();
    h += `<button class="primary" ${(!S.myTurn||S.cur.length!==S.len)?'disabled':''} onclick="makeGuess()">Prova</button>`;
  }

  else if(S.phase==='end'){
    h += `<div class="big">${S.iWon?'🏆':'😵'}</div>`;
    h += `<h2>${S.iWon?'Hai vinto!':'Hai perso'}</h2>`;
    if(S.oppSecret.length) h += `<p>Il numero dell'avversario era: <b>${S.oppSecret.join(' ')}</b></p>`;
    h += history(true);
    h += '<button class="primary" onclick="leave()">Nuova partita</button>';
  }

  $app.innerHTML = h;
  const hist = document.getElementById('hist');
  if(hist) hist.scrollTop = hist.scrollHeight;
}

render();
</script>
</body>
</html>
